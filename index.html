      typeof data.databaseId !== "string" || !/^[A-Za-z0-9_-]{8,100}$/.test(data.databaseId) ||
      !Number.isSafeInteger(data.revision) || data.revision < 0 ||
      !Number.isSafeInteger(data.nextId) || data.nextId < 1 ||
      !Array.isArray(data.records)) invalid();
  if (data.records.length > CAPACITY) throw new AppError("errorCapacity");
  const ids = new Set();
  for (const record of data.records) {
    if (!record || Object.keys(record).sort().join(",") !== "id,text,timestamp" ||
        !Number.isSafeInteger(record.id) || record.id < 1 || record.id >= data.nextId || ids.has(record.id) ||
        typeof record.timestamp !== "string" || !/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(record.timestamp) ||
        timestampFor(new Date(record.timestamp.replace(" ", "T"))) !== record.timestamp ||
        typeof record.text !== "string") invalid();
    ids.add(record.id);
  }
  return data;
}

const encodeDatabase = data => JSON.stringify(data, null, 2) + "\n";

class FileRecordStore {
  constructor(handle, source, onChange = () => {}, clock = () => new Date()) {
    this.handle = handle;
    this.source = source;
    this.data = parseDatabase(source);
    this.savedRevision = this.data.revision;
    this.onChange = onChange;
    this.clock = clock;
    this.queue = [];
    this.pumping = null;
    this.error = null;
  }

  get dirty() { return this.queue.length > 0 || this.savedRevision !== this.data.revision; }

  add() {
    const evicted = this.data.records.length === CAPACITY;
    if (evicted) this.data.records.shift();
    const record = { id: this.data.nextId++, timestamp: timestampFor(this.clock()), text: "" };
    this.data.records.push(record);
    this.enqueue();
    return { record, evicted };
  }

  remove(id) {
    const index = this.data.records.findIndex(record => record.id === id);
    if (index < 0) return false;
    this.data.records.splice(index, 1);
    this.enqueue();
    return true;
  }

  editText(id, text) {
    const record = this.data.records.find(record => record.id === id);
    if (!record || typeof text !== "string") throw new AppError("errorEdit");
    if (record.text === text) return;
    record.text = text;
    this.enqueue();
  }

  enqueue() {
    this.data.revision++;
    // Snapshot every change now; serialize writes so an older save cannot win.
    this.queue.push({ revision: this.data.revision, body: encodeDatabase(this.data) });
    this.onChange();
    this.start();
  }

  start() {
    if (this.pumping || this.error || !this.queue.length) return this.pumping;
    this.pumping = this.drain().finally(() => {
      this.pumping = null;
      this.onChange();
      if (this.queue.length && !this.error) this.start();
    });
    return this.pumping;
  }

  async drain() {
    while (this.queue.length && !this.error) {
      const snapshot = this.queue[0];
      try {
        const write = async () => {
          const current = await (await this.handle.getFile()).text();
          if (current !== this.source) {
            throw new AppError("errorConflict", "DatabaseConflictError");
          }
          let stream;
          try {
            stream = await this.handle.createWritable({ keepExistingData: false, mode: "exclusive" });
            await stream.write(snapshot.body);
            await stream.close();
          } catch (error) {
            if (stream) await stream.abort().catch(() => {});
            throw error;
          }
          // A save is acknowledged only after the browser commits the file.
          this.source = snapshot.body;
        };
        if (globalThis.navigator?.locks?.request) {
          await navigator.locks.request(`time-stamp-stack:${this.data.databaseId}`, write);
        } else {
          await write();
        }
        this.savedRevision = snapshot.revision;
        this.queue.shift();
      } catch (error) {
        this.error = error;
      }
      this.onChange();
    }
  }

  async flush() {
    while (this.queue.length || this.pumping) {
      if (this.error) throw this.error;
      await (this.pumping || this.start());
    }
    if (this.error) throw this.error;
  }

  async retry() {
    if (this.pumping) await this.pumping;
    if (this.error?.name === "DatabaseConflictError") throw this.error;
    this.error = null;
    // Retain the complete latest state, including edits made during an error.
    this.queue = [{ revision: this.data.revision, body: encodeDatabase(this.data) }];
    this.onChange();
    this.start();
    await this.flush();
  }

  async refresh() {
    if (this.dirty || this.pumping || this.error) return false;
    const expectedSource = this.source;
    const expectedRevision = this.data.revision;
    const source = await (await this.handle.getFile()).text();
    // Input may have started while the disk read was pending.
    if (this.dirty || this.pumping || this.error || this.source !== expectedSource ||
        this.data.revision !== expectedRevision || source === this.source) return false;
    const data = parseDatabase(source);
    this.source = source;
    this.data = data;
    this.savedRevision = data.revision;
    return true;
  }
}

// Browser storage remembers only the granted file handle, never the records.
async function handleCache(operation, handle) {
  let cache;
  try {
    cache = await new Promise((resolve, reject) => {
      const request = indexedDB.open("time-stamp-stack-file-handles", 1);
      request.onupgradeneeded = () => request.result.createObjectStore("handles");
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
      request.onblocked = () => reject(new Error("cache blocked"));
    });
    return await new Promise((resolve, reject) => {
      const transaction = cache.transaction("handles", operation === "get" ? "readonly" : "readwrite");
      const key = location.href.split(/[?#]/)[0];
      const store = transaction.objectStore("handles");
      const request = operation === "get" ? store.get(key) : store.put(handle, key);
      let result;
      request.onsuccess = () => { result = request.result; };
      request.onerror = () => reject(request.error);
      transaction.oncomplete = () => resolve(result);
      transaction.onerror = () => reject(transaction.error);
      transaction.onabort = () => reject(transaction.error);
    });
  } catch {
    // Some browsers restrict IndexedDB on file URLs. Choosing the file again
    // still loads its complete history; no browser cache is needed for data.
    return undefined;
  } finally {
    cache?.close();
  }
}

  </script>
  <script id="application">
"use strict";
const $ = id => document.getElementById(id);
let database = null, rememberedHandle = null, records = [];
let initialized = false, busy = false, connecting = false, booting = true;
let pageError = null, toastTimer, toastKey = null;
const supported = typeof window.showOpenFilePicker === "function" && typeof window.showSaveFilePicker === "function";
const pickerOptions = () => ({ id: "timestamp-records", types: [{ description: t("pickerDescription"), accept: { "application/json": [".json"] } }], excludeAcceptAllOption: true });
const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;

function showToast(key) {
  toastKey = key;
  $("toast-message").textContent = t(key);
  $("toast").classList.add("visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("visible"), 2200);
}

function describeError(error) {
  if (error.key) return t(error.key);
  if (error.name === "NotAllowedError" || error.name === "SecurityError") return t("errorPermission");
  if (error.name === "NotFoundError") return t("errorMissing");
  if (error.name === "NoModificationAllowedError") return t("errorLocked");
  if (error.name === "DatabaseConflictError") return t("errorConflict");
  return t("errorWrite");
}

function updateStatus() {
  const activeError = database?.error || pageError;
  const issue = activeError ? describeError(activeError) : "";
  const saving = booting || connecting || busy || database?.dirty;
  const state = issue ? "error" : saving ? "saving" : database ? "saved" : "waiting";
  const label = t(issue ? (database?.dirty ? "statusUnsaved" : "statusDisconnected") : booting ? "statusReading" : connecting ? "statusConnecting" : database?.dirty || busy ? "statusWriting" : database ? "statusSaved" : "statusWaiting");
  $("save-status").dataset.state = state;
  if ($("save-label").textContent !== label) $("save-label").textContent = label;
  $("error-message").textContent = issue;
  $("error-notice").classList.toggle("visible", Boolean(issue));
  $("retry-button").textContent = t(activeError?.name === "NotAllowedError" || activeError?.name === "SecurityError" ? "retryPermission" : "retry");
  $("retry-button").disabled = busy || connecting || !supported || activeError?.name === "DatabaseConflictError";
  $("database-name").textContent = database ? database.handle.name : t("connect");
  $("database-button").title = database ? t("databaseTitle", { name: database.handle.name }) : t("chooseDatabaseTitle");
  const locked = !initialized || busy || connecting;
  $("add-button").disabled = locked || Boolean(database?.error);
  $("database-button").disabled = busy || connecting || booting || !supported || Boolean(database?.dirty);
  $("open-database").disabled = busy || connecting || booting || !supported;
  $("create-database").disabled = busy || connecting || booting || !supported;
  $("connection-panel").hidden = Boolean(database);
  document.querySelectorAll("textarea[data-note]").forEach(input => { input.disabled = locked || !input.dataset.recordId; });
  document.querySelectorAll('button[data-action="delete"]').forEach(button => { button.disabled = locked || !button.dataset.recordId || Boolean(database?.error); });
  if (!supported) {
    $("connection-title").textContent = t("unsupportedTitle");
    $("connection-description").textContent = t("unsupportedDescription");
  } else if (!database && rememberedHandle) {
    $("connection-title").textContent = t("reconnectTitle", { name: rememberedHandle.name });
    $("connection-description").textContent = t("reconnectDescription");
  } else {
    $("connection-title").textContent = t("connectionTitle");
    $("connection-description").textContent = t("connectionDescription");
  }
}

function localizeRows() {
  document.querySelectorAll("#record-rows tr").forEach(row => {
    const values = { row: row.dataset.slot };
    const input = row.querySelector("textarea");
    input.setAttribute("aria-label", t("textLabel", values));
    input.placeholder = row.dataset.recordId ? t("notePlaceholder") : row.classList.contains("next-empty") ? t("emptyPlaceholder") : "";
    for (const [selector, key] of [
      ['[data-kind="timestamp-copy"]', "copyTimestampLabel"],
      ['[data-kind="text-copy"]', "copyTextLabel"],
      ['[data-action="delete"]', "deleteLabel"]
    ]) {
      const button = row.querySelector(selector);
      button.setAttribute("aria-label", t(key, values));
      button.title = t(key, values);
    }
  });
}

function applyLanguage() {
  document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
  document.title = t("pageTitle");
  document.querySelector('meta[name="description"]').content = t("pageDescription");
  document.querySelectorAll("[data-i18n]").forEach(element => { element.textContent = t(element.dataset.i18n); });
  document.querySelectorAll("[data-i18n-aria]").forEach(element => { element.setAttribute("aria-label", t(element.dataset.i18nAria)); });
  const button = $("language-button");
  button.textContent = language === "en" ? "中文" : "English";
  button.lang = language === "en" ? "zh-CN" : "en";
  button.setAttribute("aria-label", t("switchLanguage"));
  button.title = t("switchLanguage");
  // Translate labels in place so note contents, selection and pending saves survive.
  localizeRows();
  if (toastKey) $("toast-message").textContent = t(toastKey);
  updateStatus();
}

function fitInput(input) {
  input.style.height = "28px";
  input.style.height = `${Math.min(140, Math.max(28, input.scrollHeight))}px`;
}

    function copyButton(value, kind) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "icon-button";
      button.innerHTML = icon("copy");
      button.dataset.kind = kind;
      button.disabled = value === null;
      button.addEventListener("click", async () => {
        const text = typeof value === "function" ? value() : value;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
          } else {
            const active = document.activeElement;
            const selection = active instanceof HTMLTextAreaElement ? [active.selectionStart, active.selectionEnd] : null;
            const temporary = document.createElement("textarea");
            temporary.value = text;
            temporary.style.cssText = "position:fixed;left:-9999px;top:0;";
            document.body.appendChild(temporary);
            temporary.select();
            const copied = document.execCommand("copy");
            temporary.remove();
            if (active instanceof HTMLElement) active.focus({ preventScroll: true });
            if (selection) active.setSelectionRange(...selection);
            if (!copied) throw new Error("clipboard");
          }
          button.innerHTML = icon("check");
          button.classList.add("copied");
          showToast(kind === "timestamp-copy" ? "copiedTimestamp" : "copiedText");
          setTimeout(() => { button.innerHTML = icon("copy"); button.classList.remove("copied"); }, 1200);
        } catch {
          showToast("copyFailed");
        }
      });
      return button;
    }

    function renderRows() {
      const fragment = document.createDocumentFragment();
      for (let index = 0; index < CAPACITY; index++) {
        const record = records[index];
        const row = document.createElement("tr");
        row.dataset.slot = index + 1;
        if (record) row.dataset.recordId = record.id;
        else row.className = `empty${index === records.length ? " next-empty" : ""}`;
        const timestampCell = document.createElement("td");
        const timestampWrap = document.createElement("div");
        timestampWrap.className = "timestamp-cell";
        const number = document.createElement("span");
        number.className = "row-number";
        number.textContent = String(index + 1).padStart(2, "0");
        number.setAttribute("aria-hidden", "true");
        const timestamp = document.createElement(record ? "time" : "span");
        timestamp.className = "timestamp";
        timestamp.textContent = record ? record.timestamp : "—";
        if (record) timestamp.dateTime = record.timestamp.replace(" ", "T");
        const stampCopy = copyButton(record ? record.timestamp : null, "timestamp-copy");
        timestampWrap.append(number, timestamp, stampCopy);
        timestampCell.appendChild(timestampWrap);

        const noteCell = document.createElement("td");
        const noteWrap = document.createElement("div");
        noteWrap.className = "note-cell";
        const input = document.createElement("textarea");
        input.className = "note-input";
        input.rows = 1;
        input.dataset.note = "";
        input.dataset.recordId = record ? record.id : "";
        input.spellcheck = false;
        input.value = record ? record.text : "";
        input.disabled = !record || !initialized || busy;
        input.addEventListener("input", () => {
          database.editText(record.id, input.value);
          fitInput(input);
          updateStatus();
        });
        const actions = document.createElement("div");
        actions.className = "row-actions";
        const noteCopy = copyButton(record ? () => record.text : null, "text-copy");
        const divider = document.createElement("span");
        divider.className = "action-divider";
        divider.setAttribute("aria-hidden", "true");
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "icon-button delete";
        remove.innerHTML = icon("trash");
        remove.dataset.action = "delete";
        remove.dataset.recordId = record ? record.id : "";
        remove.disabled = !record || !initialized || busy;
        remove.addEventListener("click", () => runAction({ kind: "delete", id: record.id, slot: index }));
        actions.append(noteCopy, divider, remove);
        noteWrap.append(input, actions);
        noteCell.appendChild(noteWrap);
        row.append(timestampCell, noteCell);
        fragment.appendChild(row);
      }
      $("record-rows").replaceChildren(fragment);
      $("used-count").textContent = String(records.length);
      $("usage-track").replaceChildren(...Array.from({ length: CAPACITY }, (_, i) => {
        const tick = document.createElement("span");
        if (i < records.length) tick.className = "used";
        return tick;
      }));
      document.querySelectorAll("textarea[data-note]").forEach(fitInput);
      localizeRows();
      updateStatus();
    }


async function runAction(action) {
  if (!database || busy || connecting || database.error) return;
  busy = true;
  updateStatus();
  let focusId;
  try {
    await database.flush();
    pageError = null;
    if (action.kind === "add") {
      const result = database.add();
      focusId = result.record.id;
    } else {
      database.remove(action.id);
      focusId = records[Math.min(action.slot, records.length - 1)]?.id;
    }
    renderRows();
    await database.flush();
    showToast(action.kind === "delete" ? "deleted" : "added");
  } catch (error) {
    pageError = error;
  } finally {
    busy = false;
    updateStatus();
    if (focusId) {
      const input = document.querySelector(`textarea[data-record-id="${focusId}"]`);
      input?.focus({ preventScroll: true });
      input?.setSelectionRange(input.value.length, input.value.length);
      input?.scrollIntoView({ block: "nearest", inline: "nearest" });
    }
  }
}

async function ensurePermission(handle) {
  if (await handle.queryPermission({ mode: "readwrite" }) === "granted") return;
  if (await handle.requestPermission({ mode: "readwrite" }) !== "granted") {
    throw new AppError("errorPermission", "NotAllowedError");
  }
}

async function attachDatabase(handle, allowEmpty = false) {
  const source = await (await handle.getFile()).text();
  let store;
  if (source.length === 0 && allowEmpty) {
    // Never clear an existing nonempty file when the user chooses “New”.
    const initial = encodeDatabase(emptyDatabase());
    store = new FileRecordStore(handle, initial);
    store.source = source;
    store.enqueue();
    await store.flush();
  } else {
    store = new FileRecordStore(handle, source);
  }
  store.onChange = updateStatus;
  database = store;
  records = store.data.records;
  rememberedHandle = handle;
  initialized = true;
  pageError = null;
  renderRows();
  // Failure to remember permission must not prevent direct file persistence.
  void handleCache("put", handle);
}

async function chooseDatabase(createNew = false, forcePicker = false) {
  if (!supported || busy || connecting || database?.dirty) return;
  connecting = true;
  updateStatus();
  try {
    let handle;
    if (createNew) {
      const startIn = database?.handle ?? rememberedHandle;
      handle = await window.showSaveFilePicker({
        ...pickerOptions(),
        suggestedName: DATABASE_NAME,
        ...(startIn ? { startIn } : {})
      });
    } else if (!forcePicker && !database && rememberedHandle) {
      handle = rememberedHandle;
    } else {
      [handle] = await window.showOpenFilePicker({ ...pickerOptions(), multiple: false });
    }
    await ensurePermission(handle);
    await attachDatabase(handle, createNew);
    showToast("connected");
  } catch (error) {
    if (error.name !== "AbortError") pageError = error;
  } finally {
    connecting = false;
    updateStatus();
  }
}

async function retrySave() {
  if (busy || connecting) return;
  if (!database) return chooseDatabase(false, Boolean(pageError));
  connecting = true;
  updateStatus();
  try {
    await ensurePermission(database.handle);
    await database.retry();
    pageError = null;
    showToast("retried");
  } catch (error) {
    pageError = error;
  } finally {
    connecting = false;
    updateStatus();
  }
}

let refreshing = false;
async function refreshFromDisk() {
  if (!database || busy || connecting || refreshing || database.dirty || database.error) return;
  refreshing = true;
  try {
    if (await database.refresh()) {
      records = database.data.records;
      renderRows();
    }
  } catch (error) {
    pageError = error;
  } finally {
    refreshing = false;
    updateStatus();
  }
}

async function boot() {
  if (supported) {
    try {
      rememberedHandle = await handleCache("get");
      if (rememberedHandle && await rememberedHandle.queryPermission({ mode: "readwrite" }) === "granted") {
        await attachDatabase(rememberedHandle);
      }
    } catch (error) {
      pageError = error;
    }
  }
  booting = false;
  updateStatus();
}

$("add-button").addEventListener("click", () => runAction({ kind: "add" }));
$("open-database").addEventListener("click", () => chooseDatabase());
$("create-database").addEventListener("click", () => chooseDatabase(true));
$("database-button").addEventListener("click", () => chooseDatabase(false, true));
$("retry-button").addEventListener("click", retrySave);
$("language-button").addEventListener("click", () => {
  language = language === "en" ? "zh" : "en";
  applyLanguage();
});
window.addEventListener("focus", refreshFromDisk);
window.addEventListener("beforeunload", event => {
  if (database?.dirty || busy || connecting) {
    event.preventDefault();
    event.returnValue = "";
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refreshFromDisk();
});
renderRows();
applyLanguage();
void boot();
